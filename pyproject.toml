[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aghuse-assistant"
version = "0.1.0"
description = "AGHUse Assistant operational runtime"
requires-python = ">=3.11"

[project.scripts]
aghuse-assistant = "aghuse_assistant.app:main"
aghuse-assistant-api = "aghuse_assistant.api.http:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
